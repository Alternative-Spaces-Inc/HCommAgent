# HCA API: Cloud Build pipeline (docs/plans/HCA_CLOUD_RUN_PLAN_v1.md section 6).
#
# Runs on every merge to main through the trigger hca-main-deploy (runbook
# step 11, HCA-P8), and by hand with the block in runbook step 8. Steps:
#   0. guard: refuse a build whose substitutions would deploy without the
#      Google-link gate (HCA-P7) unless _ALLOW_UNGATED=1 says so on purpose
#   1. pytest against SQLite (fails the build before any image is built)
#   1b. smoke-local (HCA-P9): the golden path over real HTTP against a local
#      uvicorn with the gate off: key, device, ask, signed inbox, signed
#      answer, webhook, audit. scripts/smoke_golden_path.py --human
#   1c. pack-extension (HCA-P17): zip extension/ for the Chrome Web Store
#      (scripts/pack_extension.py), kept as a build artifact under
#      gs://<project>_cloudbuild/extension/ once every step succeeds
#   2. build the api image
#   3. push it to Artifact Registry
#   4. run alembic upgrade head as a Cloud Run job against Cloud SQL
#      (a job, not a startup hook, so migrations never race across instances)
#   5. deploy the service revision
#   6. smoke-live (HCA-P9): agent path against the new revision with the
#      real admin token (Secret Manager): healthz, key, ask, read, cancel.
#      The gate stays on; a test device cannot hold a Google account.
#
# Every value that names your project, region, instance or service account
# arrives as a substitution; nothing here is specific to one account.
# $PROJECT_ID, $COMMIT_SHA and $BUILD_ID are Cloud Build built-ins.

substitutions:
  _REGION: us-west1
  _AR_REPO: hca-services
  _IMAGE: hca-api
  _SERVICE: hca-api-service
  _MIGRATE_JOB: hca-migrate
  _RUNTIME_SA: sa-hca-api
  _CLOUDSQL_INSTANCE: ""            # PROJECT_ID:REGION:INSTANCE, set by the trigger or the block
  _DB_URL_SECRET: hca-database-url
  _SWEEP_TOKEN_SECRET: hca-sweep-trigger-token
  _ADMIN_TOKEN_SECRET: hca-admin-token
  _PEPPER_SECRET: hca-api-key-pepper   # HMAC pepper for api key hashes (api/app/apikeys.py)
  _MAX_INSTANCES: "1"               # in-process event bus; see api/Dockerfile
  _GOOGLE_CLIENT_ID: ""             # HCA-P7: public client id of the Chrome Extension OAuth client (set by the block)
  _GOOGLE_CLIENT_IDS: ""            # HCA-P13: extra client ids allowed to link, comma separated (Desktop client of the macOS app)
  _OWNER_EMAILS: ""                 # HCA-P7: comma separated owner accounts allowed to link; empty = any verified account
  _REQUIRE_GOOGLE_LINK: "1"         # HCA-P7: human routes refuse a device with no linked Google account
  _ALLOW_UNGATED: "0"               # HCA-P8: "1" only for a first deploy on a fresh project (no client id yet)

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_ADMIN_TOKEN_SECRET}/versions/latest
      env: HCA_ADMIN_TOKEN

steps:
  - id: guard
    name: bash
    env:
      - CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - REQ=${_REQUIRE_GOOGLE_LINK}
      - ALLOW_UNGATED=${_ALLOW_UNGATED}
    args:
      - -c
      - |
        set -euo pipefail
        if [ "$$ALLOW_UNGATED" = "1" ]; then echo "guard: ungated build allowed on purpose"; exit 0; fi
        [ -n "$$CLIENT_ID" ] || { echo "guard: _GOOGLE_CLIENT_ID is empty; set it on the trigger or pass _ALLOW_UNGATED=1"; exit 1; }
        [ "$$REQ" = "1" ] || { echo "guard: _REQUIRE_GOOGLE_LINK is '$$REQ', not 1; the P7 gate would drop silently"; exit 1; }
        echo "guard: gate pinned"

  - id: pytest
    name: python:3.12-slim
    dir: api
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir -q -r requirements.txt
        export DATABASE_URL=sqlite:////tmp/hca_cloudbuild.db
        alembic upgrade head
        pytest -q

  - id: smoke-local
    name: python:3.12-slim
    entrypoint: bash
    env:
      - HCA_ADMIN_TOKEN=smoke-local-admin
      - HCA_API_KEY_PEPPER=smoke-local-pepper-0123456789
      - HCA_REQUIRE_GOOGLE_LINK=0
      - DATABASE_URL=sqlite:////tmp/hca_smoke.db
    args:
      - -c
      - |
        set -euo pipefail
        cd api
        pip install --no-cache-dir -q -r requirements.txt
        alembic upgrade head
        uvicorn app.main:app --host 127.0.0.1 --port 8080 --log-level warning &
        for i in $$(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
        python3 ../scripts/smoke_golden_path.py --base http://127.0.0.1:8080 --human

  - id: pack-extension
    name: python:3.12-slim
    entrypoint: bash
    env:
      - COMMIT=${COMMIT_SHA}
    args:
      - -c
      - |
        set -euo pipefail
        python3 scripts/pack_extension.py --out dist --commit "$$COMMIT" | tee dist-pack.json
        ls -l dist

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: api
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${COMMIT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run jobs deploy ${_MIGRATE_JOB} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${COMMIT_SHA} \
          --region=${_REGION} \
          --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-cloudsql-instances=${_CLOUDSQL_INSTANCE} \
          --set-secrets=DATABASE_URL=${_DB_URL_SECRET}:latest \
          --command=sh \
          --args=-c,"alembic upgrade head && python3 scripts/check_migrated.py" \
          --max-retries=0 \
          --task-timeout=10m \
          --quiet
        gcloud run jobs execute ${_MIGRATE_JOB} --region=${_REGION} --wait --quiet

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${COMMIT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --add-cloudsql-instances=${_CLOUDSQL_INSTANCE} \
          --set-secrets=DATABASE_URL=${_DB_URL_SECRET}:latest,SWEEP_TRIGGER_TOKEN=${_SWEEP_TOKEN_SECRET}:latest,HCA_ADMIN_TOKEN=${_ADMIN_TOKEN_SECRET}:latest,HCA_API_KEY_PEPPER=${_PEPPER_SECRET}:latest \
          "--set-env-vars=^:^HCA_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}:HCA_GOOGLE_CLIENT_IDS=${_GOOGLE_CLIENT_IDS}:HCA_OWNER_EMAILS=${_OWNER_EMAILS}:HCA_REQUIRE_GOOGLE_LINK=${_REQUIRE_GOOGLE_LINK}" \
          --min-instances=1 \
          --max-instances=${_MAX_INSTANCES} \
          --concurrency=80 \
          --no-cpu-throttling \
          --timeout=3600 \
          --allow-unauthenticated \
          --labels=commit=${COMMIT_SHA},build=${BUILD_ID} \
          --quiet

  - id: smoke-live
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    secretEnv: [HCA_ADMIN_TOKEN]
    args:
      - -c
      - |
        set -euo pipefail
        URL="$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')"
        python3 scripts/smoke_golden_path.py --base "$$URL"

artifacts:
  objects:
    location: gs://${PROJECT_ID}_cloudbuild/extension/
    paths:
      - dist/extension-*.zip

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE}:latest

timeout: 1800s
