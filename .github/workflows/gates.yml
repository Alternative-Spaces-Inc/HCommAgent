name: HCA Quality Gates

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dashes:
    name: Check No Dash Characters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run dash gate
        run: python3 .github/gates/check_no_dashes.py

  client-data:
    name: Check Client Data Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run client data gate
        run: python3 .github/gates/check_client_data.py

  manifest:
    name: Check Bootstrap Manifest Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run manifest gate
        run: python3 .github/gates/check_manifest.py

  openapi:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator
      - name: Validate OpenAPI spec
        run: openapi-spec-validator api/openapi.yaml

  pytest:
    name: API Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub official image via the AWS ECR Public mirror: the
        # unauthenticated Docker Hub pull limit failed this job twice on
        # 2026-10-09 before any test ran.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: hca
          POSTGRES_PASSWORD: hca
          POSTGRES_DB: hca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://hca:hca@localhost:5432/hca_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt psycopg2-binary pytest-cov
      - name: Run migrations
        working-directory: api
        run: alembic upgrade head
      - name: Check the database is at head (catches a rolled back upgrade)
        working-directory: api
        run: python3 scripts/check_migrated.py
      - name: Run pytest with coverage (fails under 85 percent of app/)
        working-directory: api
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Check OpenAPI parity (yaml versus generated schema)
        run: pip install pyyaml && python3 .github/gates/check_openapi_parity.py

  extension:
    name: Extension Tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run the extension unit tests
        working-directory: extension
        run: npm test

  swift-tests:
    name: Swift Tests (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run the HCACore and HCANotifier XCTests
        working-directory: macos
        run: swift test 2>&1 | tail -40

  ruff:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.17.0
      - name: Lint api, gate scripts and scripts (profile in ruff.toml)
        run: ruff check api .github/gates scripts

  pip-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit the pinned API requirements
        working-directory: api
        run: pip-audit -r requirements.txt --progress-spinner off
