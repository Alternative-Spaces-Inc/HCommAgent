name: HCA Quality Gates

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dashes:
    name: Check No Dash Characters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run dash gate
        run: python3 .github/gates/check_no_dashes.py

  client-data:
    name: Check Client Data Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run client data gate
        run: python3 .github/gates/check_client_data.py

  manifest:
    name: Check Bootstrap Manifest Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run manifest gate
        run: python3 .github/gates/check_manifest.py

  openapi:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator
      - name: Validate OpenAPI spec
        run: openapi-spec-validator api/openapi.yaml

  pytest:
    name: API Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hca
          POSTGRES_PASSWORD: hca
          POSTGRES_DB: hca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://hca:hca@localhost:5432/hca_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt psycopg2-binary
      - name: Run migrations
        working-directory: api
        run: alembic upgrade head
      - name: Run pytest
        working-directory: api
        run: pytest -v

  extension:
    name: Extension Tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the extension unit tests
        working-directory: extension
        run: npm test

  ruff:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.17.0
      - name: Lint api, gate scripts and scripts (profile in ruff.toml)
        run: ruff check api .github/gates scripts

  pip-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit the pinned API requirements
        working-directory: api
        run: pip-audit -r requirements.txt --progress-spinner off
