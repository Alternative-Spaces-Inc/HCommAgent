name: HCA Quality Gates

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dashes:
    name: Check No Dash Characters
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Run dash gate
        run: python3 .github/gates/check_no_dashes.py

  client-data:
    name: Credential and History Scan
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Run client data gate
        run: python3 .github/gates/check_client_data.py --history

  manifest:
    name: Product Isolation
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --require-hashes -r api/requirements-dev.lock
      - name: Run manifest gate
        run: python3 .github/gates/check_manifest.py

  openapi:
    name: Validate OpenAPI Specification
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install openapi-spec-validator
        run: pip install --require-hashes -r api/requirements-dev.lock
      - name: Validate OpenAPI spec
        run: openapi-spec-validator api/openapi.yaml

  pytest:
    name: API Tests (Postgres)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub official image via the AWS ECR Public mirror: the
        # unauthenticated Docker Hub pull limit failed this job twice on
        # 2026-10-09 before any test ran.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: hca
          POSTGRES_PASSWORD: hca
          POSTGRES_DB: hca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://hca:hca@localhost:5432/hca_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: api
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Run migrations
        working-directory: api
        run: alembic upgrade head
      - name: Check the database is at head (catches a rolled back upgrade)
        working-directory: api
        run: python3 scripts/check_migrated.py
      - name: Credential-free real HTTP and signed-delivery demonstration
        run: python scripts/demo_workflow.py
      - name: Run pytest with coverage (fails under 85 percent of app/)
        working-directory: api
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Check OpenAPI parity (yaml versus generated schema)
        run: pip install --require-hashes -r api/requirements-dev.lock && python3 .github/gates/check_openapi_parity.py

  extension:
    name: Extension Tests (Node 24)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Run the extension unit tests
        working-directory: extension
        run: |
          npm ci
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser

  swift-tests:
    name: Swift Tests (macOS)
    timeout-minutes: 20
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run the HCACore and HCANotifier XCTests
        working-directory: macos
        run: swift test 2>&1 | tee swift-tests.log
      - name: Retain Swift diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: swift-tests
          path: macos/swift-tests.log

  ruff:
    name: Python Lint (ruff)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install --require-hashes -r api/requirements-dev.lock
      - name: Lint api, gate scripts and scripts (profile in ruff.toml)
        run: ruff check api .github/gates scripts

  pip-audit:
    name: Python Dependency Audit (pip-audit)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install --require-hashes -r api/requirements-dev.lock
      - name: Audit the pinned API requirements
        working-directory: api
        run: pip-audit -r requirements.txt --progress-spinner off

  container-security:
    name: Container Security and SBOM
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build non-root release image with provenance
        run: docker buildx build --provenance=mode=max --sbom=true --output type=oci,dest=hca-release.oci.tar --metadata-file hca-provenance.json -t hca-review:ci api
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          input: hca-release.oci.tar
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Export image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          input: hca-release.oci.tar
          format: cyclonedx
          output: hca-sbom.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hca-container-sbom
          path: |
            hca-sbom.json
            hca-provenance.json
          retention-days: 7
