name: HCA Quality Gates

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dashes:
    name: Check No Dash Characters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run dash gate
        run: python3 .github/gates/check_no_dashes.py

  client-data:
    name: Check Client Data Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run client data gate
        run: python3 .github/gates/check_client_data.py

  manifest:
    name: Check Bootstrap Manifest Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml==6.0.2
      - name: Run manifest gate
        run: python3 .github/gates/check_manifest.py

  openapi:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator==0.9.0
      - name: Validate OpenAPI spec
        run: openapi-spec-validator api/openapi.yaml

  pytest:
    name: API Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Google mirrors popular Docker Hub images, avoiding registry pull limits.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: hca
          POSTGRES_PASSWORD: hca
          POSTGRES_DB: hca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://hca:hca@localhost:5432/hca_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt
      - name: Run migrations
        working-directory: api
        run: alembic upgrade head
      - name: Check the database is at head (catches a rolled back upgrade)
        working-directory: api
        run: python3 scripts/check_migrated.py
      - name: Run pytest with coverage (fails under 85 percent of app/)
        working-directory: api
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Check OpenAPI parity (yaml versus generated schema)
        run: pip install pyyaml==6.0.2 && python3 .github/gates/check_openapi_parity.py

  extension:
    name: Extension Tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Run the extension unit tests
        working-directory: extension
        run: npm test

  swift-tests:
    name: Swift Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the HCACore and HCANotifier XCTests
        working-directory: macos
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log | tail -40
      - name: Upload the full Swift test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-test-log
          path: macos/swift-test.log
          retention-days: 7

  ruff:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.17.0
      - name: Lint api, gate scripts and scripts (profile in ruff.toml)
        run: ruff check api .github/gates scripts

  pip-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit the pinned API requirements
        working-directory: api
        run: pip-audit -r requirements-dev.txt --progress-spinner off
