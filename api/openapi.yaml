      - AdminToken: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      - name: email
        in: path
        required: true
        schema:
          type: string
          title: Email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tenants/{tenant_id}/records:
    get:
      tags:
      - data
      summary: Export Records
      operationId: export_records_v1_tenants__tenant_id__records_get
      security:
      - AdminToken: []
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          title: Tenant Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          default: ''
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestView'
                title: Response Export Records V1 Tenants  Tenant Id  Records Get
          headers:
            X-HCA-Next-Cursor:
              description: Pass as after for the next page
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tenants/{tenant_id}/records/purge:
    post:
      tags:
