openapi: 3.1.0
info:
  title: Human Collections Agent (HCA) API
  version: 0.3.0
paths:
  /v1/requests:
    post:
      tags:
      - requests
      summary: Create Request
      operationId: create_request_v1_requests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReceipt'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - AgentKey: []
  /v1/requests/{request_id}:
    get:
      tags:
      - requests
      summary: Get Request
      operationId: get_request_v1_requests__request_id__get
      security:
      - AgentKey: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/requests/{request_id}/answer:
    post:
      tags:
      - requests
      summary: Answer Request
      operationId: answer_request_v1_requests__request_id__answer_post
      security:
      - DeviceSignature: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSubmission'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/requests/{request_id}/cancel:
    post:
      tags:
      - requests
      summary: Cancel Request
      operationId: cancel_request_v1_requests__request_id__cancel_post
      security:
      - AgentKey: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequestBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReceipt'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/audit:
    get:
      tags:
      - audit
      summary: Query Audit
      operationId: query_audit_v1_audit_get
      security:
      - DeviceSignature: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          default: ''
          title: After
      - name: agent
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by agent ID
          title: Agent
        description: Filter by agent ID
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter by start timestamp
          title: From
        description: Filter by start timestamp
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter by end timestamp
          title: To
        description: Filter by end timestamp
      - name: surface
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by delivery or answer surface
          title: Surface
        description: Filter by delivery or answer surface
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by decision or answer outcome
          title: Outcome
        description: Filter by decision or answer outcome
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnswerRecord'
                title: Response Query Audit V1 Audit Get
          headers:
            X-HCA-Next-Cursor:
              description: Pass as after for the next page
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/inbox:
    get:
      tags:
      - inbox
      summary: List Inbox
      operationId: list_inbox_v1_inbox_get
      security:
      - DeviceSignature: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: after
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          default: ''
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InboxItem'
                title: Response List Inbox V1 Inbox Get
          headers:
            X-HCA-Next-Cursor:
              description: Pass as after to request the next page
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/inbox/stream:
    get:
      tags:
      - inbox
      summary: Stream Inbox
      operationId: stream_inbox_v1_inbox_stream_get
      security:
      - DeviceSignature: []
      parameters:
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Last event id seen, for clients that cannot set the Last-Event-ID
            header
          title: Since
        description: Last event id seen, for clients that cannot set the Last-Event-ID
          header
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/api-keys:
    get:
      tags:
      - api-keys
      summary: List Keys
      operationId: list_keys_v1_api_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeyView'
                type: array
                title: Response List Keys V1 Api Keys Get
      security:
      - AdminToken: []
    post:
      tags:
      - api-keys
      summary: Issue Key
      operationId: issue_key_v1_api_keys_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyIssueRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - AdminToken: []
  /v1/api-keys/{prefix}/revoke:
    post:
      tags:
      - api-keys
      summary: Revoke Key
      description: 'Revoke by the visible prefix (HCA-P10). Idempotent like device

        revoke: a second call returns the same row with its original

        revoked_at. From then on verify_api_key refuses the key, so every

        agent route answers 403 for it.'
      operationId: revoke_key_v1_api_keys__prefix__revoke_post
      security:
      - AdminToken: []
      parameters:
      - name: prefix
        in: path
        required: true
        schema:
          type: string
          title: Prefix
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/internal/expiry-sweep:
    post:
      tags:
      - internal
      summary: Trigger Expiry Sweep
      operationId: trigger_expiry_sweep_v1_internal_expiry_sweep_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/internal/metrics:
    get:
      tags:
      - internal
      summary: Read Metrics
      operationId: read_metrics_v1_internal_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - AdminToken: []
  /v1/devices:
    get:
      tags:
      - devices
      summary: List Devices
      operationId: list_devices_v1_devices_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeviceView'
                type: array
                title: Response List Devices V1 Devices Get
      security:
      - AdminToken: []
    post:
      tags:
      - devices
      summary: Register Device
      operationId: register_device_v1_devices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - AdminToken: []
  /v1/devices/{device_id}/revoke:
    post:
      tags:
      - devices
      summary: Revoke Device
      operationId: revoke_device_v1_devices__device_id__revoke_post
      security:
      - AdminToken: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/devices/self:
    get:
      tags:
      - devices
      summary: Self View
      description: The calling device's own row; the options page shows the linked
        account from it.
      operationId: self_view_v1_devices_self_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceView'
      security:
      - DeviceSignature: []
    patch:
      tags:
      - devices
      summary: Patch Self
      description: 'The calling device sets its own place in the surface ladder (HCA-P14

        priority controls). Same gate as answering: a registered, signed and,

        when the gate is on, Google-linked device. Only the owner''s own devices

        can move themselves; nobody can move another device this way. Declared

        before the admin PATCH /{device_id} so the literal path self wins.'
      operationId: patch_self_v1_devices_self_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - DeviceSignature: []
  /v1/devices/{device_id}:
    patch:
      tags:
      - devices
      summary: Patch Device
      description: 'Set the device''s place in the surface ladder (HCA-P14). Lower
        is

        earlier; equal values share a rank. The owner sets this once from the

        runbook Terminal block.'
      operationId: patch_device_v1_devices__device_id__patch
      security:
      - AdminToken: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/devices/self/google-link:
    post:
      tags:
      - devices
      summary: Google Link
      operationId: google_link_v1_devices_self_google_link_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLink'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - DeviceSignature: []
  /v1/tenants:
    get:
      tags:
      - tenants
      summary: List Tenants
      operationId: list_tenants_v1_tenants_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TenantView'
                type: array
                title: Response List Tenants V1 Tenants Get
      security:
      - AdminToken: []
    post:
      tags:
      - tenants
      summary: Create Tenant
      operationId: create_tenant_v1_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantView'
        '422':
