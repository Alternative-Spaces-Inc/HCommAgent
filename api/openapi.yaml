      description: 'The url must be https (no userinfo, port 443 or above 1023) and must not point at a loopback,
        private, link local, multicast, reserved or cloud metadata address, by literal or by resolution (IPv4 mapped,
        6to4 and Teredo IPv6 forms are judged by the inner address). The addresses it resolved to are pinned on
        the row and re-checked at every send. The same url cannot be registered twice while active; rotate or revoke.
        Each registration writes a registry audit row. Deliveries to the destination carry X-HCA-Delivery-Id (stable
        across retries, must equal delivery_id in the signed body before deduplication), X-HCA-Timestamp (unix seconds),
        X-HCA-Event, X-HCA-Request-Id and X-HCA-Signature "t=<ts>,v1=<hex>" where v1 is HMAC-SHA256 under the secret
        over "<ts>.<raw body>"; during a rotation overlap a second v1 under the previous secret follows. Failed
        deliveries retry at 1 s, 5 s, 30 s, 2 min, 10 min, 30 min and 1 h (jittered) and are marked dead after the
        8th failure. One overall 10 second deadline includes DNS. Only HTTP status is consumed; response bodies
        are not read or decompressed.

