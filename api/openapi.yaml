                title: Response Query Audit V1 Audit Get
          headers:
            X-HCA-Next-Cursor:
              description: Pass as after for the next page
              schema:
                type: string
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
        '413':
          description: Request body exceeds 1 MiB
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
