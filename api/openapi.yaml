  securitySchemes:
    AgentKey:
      type: http
      scheme: bearer
      description: 'Agent api key hca_live_<prefix>_<secret> issued under the admin
        bearer. Each key carries a subset of the fixed scopes asks:create (POST /v1/requests),
        asks:read (GET /v1/requests/{request_id}), asks:cancel (POST /v1/requests/{request_id}/cancel)
        and webhooks:manage (every /v1/webhooks route); omitted at issuance means
        all four. A key lacking the route''s scope gets 403 with detail ''api key
        lacks scope <name>'' and a WWW-Authenticate: Bearer scope="<name>" challenge.
        Credentials are never accepted in a query string.'
    DeviceSignature:
      type: apiKey
      in: header
      name: X-HCA-Signature
      description: 'Base64url raw P-256 ECDSA signature over the canonical HCA1 request
        All four device headers are required together. Canonical fields joined by
        newline: HCA1, timestamp, nonce, METHOD, path-and-query, SHA256(body). Timestamp
        skew is at most 300 seconds; nonce retention is 601 seconds. Production human
        decision routes also require current Google owner membership.'
    AdminToken:
      type: http
      scheme: bearer
    DeviceID:
      type: apiKey
      in: header
      name: X-HCA-Device
      description: Registered device ID
    DeviceTimestamp:
      type: apiKey
      in: header
      name: X-HCA-Timestamp
      description: Unix seconds within 300 seconds of server time
    DeviceNonce:
      type: apiKey
      in: header
      name: X-HCA-Nonce
      description: Fresh random nonce; replayed nonces are refused
    SweepBearer:
      type: http
      scheme: bearer
      description: SWEEP_TRIGGER_TOKEN used only by the internal scheduler; missing
        server configuration fails closed.
