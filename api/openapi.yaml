                type: string
              description: true for a stored idempotent response
        '413':
          description: Request body exceeds 1 MiB
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
        '429':
          description: Shared rate limit or tenant quota reached
          headers:
            Retry-After:
              description: Seconds until retry
              schema:
                type: string
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
        '409':
          description: Request already answered, expired, withdrawn or cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalConflict'
