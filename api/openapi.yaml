openapi: 3.1.0
info:
  title: Human Collections Agent (HCA) API
  version: 0.2.0
  x-decisions: docs/decisions/DECISIONS_20260929.md
  description: >
    Collects what a human must decide or supply. A host UI or an AI system posts a
    collection request; HCA renders it front and center over the host page (or on a
    standalone surface), collects the answer with the requested control, and returns a
    typed answer record. Skeleton for Maya's plan; every control gets a full schema,
    validation rules and a worked example in v0.2.
paths:
  /v1/requests:
    post:
      summary: Create a collection request
      security:
        - AgentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '201':
          description: Request accepted; rendered when the target human arrives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReceipt'
        '401':
          description: Missing bearer token
        '403':
          description: Invalid or revoked api key, or body.caller does not match the key's caller
  /v1/requests/{request_id}:
    get:
      summary: Read a request and its answer if any
      security:
        - AgentKey: []
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The request with its current state and answer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
  /v1/requests/{request_id}/answer:
    post:
      summary: Record the human's answer (called by the HCA surface, not by hosts)
      security:
        - DeviceSignature: []
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSubmission'
      responses:
        '201':
          description: Answer recorded and delivered to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerRecord'
        '409': { description: "Request already answered, expired, withdrawn or cancelled" }
        '422': { description: "Value does not fit the control or the option ids" }
  /v1/requests/{request_id}/cancel:
    post:
      summary: Cancel a request with a reason
      security:
        - AgentKey: []
      parameters:
        - in: path
          name: request_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: Reason for cancelling the request }
      responses:
        '200':
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReceipt'
  /v1/inbox:
    get:
      summary: List pending requests sorted by deadline and impact
      security:
        - DeviceSignature: []
      responses:
        '200':
          description: Array of pending collection requests sorted by deadline and impact, each carrying its request_id
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/CollectionRequest'
                    - type: object
                      required: [request_id]
                      properties:
                        request_id:
                          type: string
                          description: Id the surface answers against in POST /v1/requests/ID/answer
  /v1/inbox/stream:
    get:
      summary: Stream inbox events via Server-Sent Events (SSE)
      security:
        - DeviceSignature: []
      description: >
        Server-Sent Events (SSE) stream pushing request.created, request.escalated,
        request.answered, request.cancelled, and request.expired events to connected
        surfaces. Since HCA-P14 the created and escalated envelopes carry
        data.visible_to, the device ids the event applies to at that moment; a
        surface ignores envelopes that do not name its device. Envelopes without
        visible_to (older servers) are treated as visible.
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/InboxStreamEvent'
  /v1/audit:
    get:
      summary: Query audit history with filters
      security:
        - DeviceSignature: []
      parameters:
        - in: query
          name: agent
          schema: { type: string }
          description: Filter by agent ID
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: Filter by start timestamp
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: Filter by end timestamp
        - in: query
          name: surface
          schema: { $ref: '#/components/schemas/Surface' }
          description: Filter by delivery or answer surface
        - in: query
          name: outcome
          schema: { type: string }
          description: Filter by decision or answer outcome
      responses:
        '200':
          description: List of historical answer records with surface and device information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnswerRecord'
  /v1/controls:
    get:
      summary: The control library, machine readable, for AI systems
      responses:
        '200':
          description: Every control with request schema, answer schema and example
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ControlSpec' }
  /v1/devices:
    post:
      summary: Register a human surface device by its ECDSA P-256 public key (HCA-P6)
      security:
        - AdminToken: []
      description: >
        The owner registers the key the extension's options page shows, once
        per browser profile. Posting the same key again is idempotent (201,
        label updated); a revoked key is 409 and needs a new key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '201':
          description: The registered device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceView' }
        '401': { description: Missing bearer }
        '403': { description: Wrong admin token or admin token not configured }
        '409': { description: Key was revoked }
        '422': { description: Not an ECDSA P-256 public key in SPKI PEM form }
    get:
      summary: List registered devices, revoked included (HCA-P6)
      security:
        - AdminToken: []
      responses:
        '200':
          description: All devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceView' }
  /v1/devices/self:
    get:
      summary: The calling device's own row, linked Google account included (HCA-P7)
      security:
        - DeviceSignature: []
      responses:
        '200':
          description: This device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceView' }
        '401': { description: "Device signature missing, stale, replayed or not verifying" }
        '403': { description: Device unknown or revoked }
    patch:
      summary: The calling device sets its own surface ladder priority (HCA-P14 priority controls)
      description: >-
        Same gate as answering (device signature, Google link when the gate is on).
        Lets the owner choose the primary surface from the Mac menu or the extension
        options page without the admin token. Lower is earlier; equal values share a rank.
      security:
        - DeviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: This device with its new priority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceView' }
        '401': { description: "Device signature missing, stale, replayed or not verifying" }
        '403': { description: Device unknown, revoked or not Google-linked }
        '422': { description: priority outside 0 to 1000 }
  /v1/devices/self/google-link:
    post:
      summary: Link the calling device to a Google account (HCA-P7, app/googleauth.py)
      description: >
        The extension obtains an access token for its Chrome Extension OAuth
        client (chrome.identity.getAuthToken, manifest oauth2 block) and posts
        it over a device-signed call. The server verifies it at Google's
        tokeninfo endpoint and accepts it only when it was issued to
        HCA_GOOGLE_CLIENT_ID, the email is verified, the token is unexpired
        and, when HCA_OWNER_EMAILS is set, the email is on that list. Linking
        again replaces the account. When HCA_REQUIRE_GOOGLE_LINK is "1" the
        human routes (inbox, inbox/stream, answer, audit) refuse an unlinked
        device with 403; this route always accepts a signed device so it can
        link.
      security:
        - DeviceSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token: { type: string, description: OAuth access token from chrome.identity for the extension's own client }
      responses:
        '200':
          description: Device now linked; google_email and google_linked_at set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceView' }
        '401': { description: "Device signature failed, or the Google token did not verify or has expired" }
        '403': { description: "Device unknown or revoked, token issued to another client, email unverified, or account not on the owner list" }
        '422': { description: access_token missing }
        '503': { description: HCA_GOOGLE_CLIENT_ID not configured (fails closed) }
  /v1/devices/{device_id}:
    patch:
      summary: Set the device's place in the surface ladder (HCA-P14)
      description: >
        Lower priority is earlier; devices with equal values share a rank and see an
        ask together. An ask is visible to rank r from created_at plus r times the
        fallback window (HCA_SURFACE_FALLBACK_SECONDS, default 90; half for a red
        gate). Devices not seen within HCA_DEVICE_ACTIVE_SECONDS (default 600) are
        left out of the ranking.
      security:
        - AdminToken: []
      parameters:
        - in: path
          name: device_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: The device with its new priority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceView' }
        '404': { description: Unknown device }
        '422': { description: priority outside 0 to 1000 }
  /v1/devices/{device_id}/revoke:
    post:
      summary: Revoke a device so its signatures stop verifying (HCA-P6)
      security:
        - AdminToken: []
      parameters:
        - in: path
          name: device_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The device, now revoked (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceView' }
        '404': { description: Unknown device }
  /v1/api-keys:
    post:
      summary: Issue an API key for an automation caller (PROPOSED, not yet in the 2026-09-29 decisions log)
      security:
        - AdminToken: []
      description: >
        Added in dispatch hca-p3-20260929, not one of the endpoints the
        2026-09-29 decisions log reconciled (see docs/decisions/DECISIONS_20260929.md);
        this path awaits the same review cancel, inbox, inbox/stream, and audit
        already got before it is treated as settled canon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caller]
              properties:
                caller:
                  type: string
                  description: Agent or system id this key authenticates as
      responses:
        '201':
          description: The plaintext key, shown once; only its hash is stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssueResponse'
    get:
      summary: List issued keys without secret material (HCA-P10)
      security:
        - AdminToken: []
      responses:
        '200':
          description: Every key row, oldest first; revoked rows carry revoked_at
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyView'
  /v1/api-keys/{prefix}/revoke:
    post:
      summary: Revoke a key by its visible prefix (HCA-P10)
      description: >
        Idempotent, like device revoke. After this every agent route answers
        403 for the key. The smoke script calls it on the key it minted so a
        merge leaves no live credential behind.
      security:
        - AdminToken: []
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The key row with revoked_at set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyView'
        '404':
          description: No key with that prefix

components:
  securitySchemes:
    AgentKey:
      type: http
      scheme: bearer
      description: >
        Automation caller credential, hca_live_<prefix>_<secret>, issued by
        POST /v1/api-keys and hashed at rest. Required on the agent-facing
        routes (create, read, cancel). A key acts only as its own caller:
        creating as another caller is 403, another caller's request reads
        and cancels as 404. Human surface routes (inbox, inbox/stream,
        answer) and audit take DeviceSignature instead.
    AdminToken:
      type: http
      scheme: bearer
      description: >
        Owner-held token (HCA_ADMIN_TOKEN, Secret Manager at deploy time)
        for minting agent keys and registering devices. Missing
        configuration fails closed (403).
    DeviceSignature:
      type: apiKey
      in: header
      name: X-HCA-Signature
      description: >
        Per-device ECDSA P-256 request signing for the human surface
        (plan section 4, Proof of Surface; api/app/devicesig.py). Four
        headers travel together: X-HCA-Device (dev_ plus the first 32 hex
        chars of SHA-256 over the key's SubjectPublicKeyInfo DER),
        X-HCA-Timestamp (unix seconds, within 300 s of the server),
        X-HCA-Nonce (unique per request) and X-HCA-Signature (base64url,
        no padding, of the raw 64-byte r||s signature) over the string
        "HCA1" NL timestamp NL nonce NL METHOD NL path_and_query NL
        sha256hex(body). Missing or failing headers, a stale timestamp or
        a reused nonce are 401 with WWW-Authenticate: HCA-Device; an
        unknown or revoked device is 403. The answer route records the
        verified device id on the AnswerRecord, ignoring any device the
        body claims. Devices are registered with POST /v1/devices.
  schemas:
    DeviceRegistration:
      type: object
      required: [label, public_key_pem]
      properties:
        label: { type: string, description: Human name for the device, recorded as answered_by when the answer body gives none }
        public_key_pem: { type: string, description: ECDSA P-256 public key, SubjectPublicKeyInfo PEM }
        surface: { type: string, default: browser_overlay }
    DeviceView:
      type: object
      required: [device_id, label, surface, created_at]
      properties:
        device_id: { type: string }
        label: { type: string }
        surface: { type: string }
        priority: { type: integer, default: 100, description: Surface ladder position, lower is earlier (HCA-P14) }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        google_email: { type: string, nullable: true, description: Google account linked through /v1/devices/self/google-link (HCA-P7) }
        google_linked_at: { type: string, format: date-time, nullable: true }
    ApiKeyView:
      type: object
      required: [prefix, caller, created_at]
      properties:
        prefix: { type: string }
        caller: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    ApiKeyIssueResponse:
      type: object
      required: [api_key, prefix, caller, created_at]
      properties:
        api_key:
          type: string
          description: The plaintext key, formatted hca_live_<prefix>_<secret>; shown once
        prefix:
          type: string
          description: The non-secret lookup prefix, stored in the clear
        caller:
          type: string
        created_at:
          type: string
          format: date-time

    Surface:
      type: string
      enum: [browser_overlay, browser_notification, macos_notification, macos_app, web]
      description: The surface on which a request is delivered or answered.
    CollectionRequest:
      type: object
      required: [caller, audience, title, control, options_or_fields, suggested, deliver_to]
      properties:
        caller: { type: string, description: Agent or system id making the request }
        audience: { type: string, description: Human identity or role that must answer }
        title: { type: string }
        why: { type: string, description: Plain reason the answer is needed now }
        path_hint: { $ref: '#/components/schemas/PathHint' }
        zoom:
          type: object
          description: The underlying data the decision is about (a row, a diff, an image url)
        control:
          type: string
          enum: [radio, checkbox, approve_deny, dropdown, chat, confirm_rows]
        options_or_fields:
          type: array
          items: { $ref: '#/components/schemas/Option' }
        suggested:
          type: object
          description: The suggested option and why; always present for selections
          properties:
            option_id: { type: string }
            why: { type: string }
        red_gate:
          type: object
          description: Present when the decision is a red gate
          properties:
            resource: { type: string }
            change: { type: string }
            impact: { type: string }
            exact_command: { type: string }
            rollback: { type: string }
        voice:
          type: object
          properties:
            read_aloud: { type: boolean, default: false }
            accept_speech: { type: boolean, default: false }
        deadline_at: { type: string, format: date-time }
        expiry_policy:
          type: string
          enum: [auto_deny, expire, hold]
          default: auto_deny
          description: Policy when unanswered at deadline_at (defaults to auto_deny for red gates)
        deliveries:
          type: array
          description: List of delivery attempts across surfaces
          items:
            type: object
            required: [surface, delivered_at, state]
            properties:
              surface: { $ref: '#/components/schemas/Surface' }
              delivered_at: { type: string, format: date-time }
              state: { type: string }
        deliver_to:
          type: object
          description: Where the answer goes back
          properties:
            mode: { type: string, enum: [webhook, poll, websocket] }
            url: { type: string }
    Option:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string, description: Value of this option and when it is the right pick }
    PathHint:
      type: object
      properties:
        route: { type: string }
        screen: { type: string }
        control_label: { type: string }
        button_label: { type: string }
    RequestReceipt:
      type: object
      properties:
        request_id: { type: string }
        state: { type: string, enum: [queued, shown, answered, expired, withdrawn, cancelled] }
    RequestView:
      type: object
      description: A request with its current state and, once answered, its answer record
      required: [request_id, state, request]
      properties:
        request_id: { type: string }
        state: { type: string, enum: [queued, shown, answered, expired, withdrawn, cancelled] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        request: { $ref: '#/components/schemas/CollectionRequest' }
        answer: { $ref: '#/components/schemas/AnswerRecord' }
    AnswerSubmission:
      type: object
      description: Body of POST /v1/requests/{request_id}/answer, sent by the HCA surface
      required: [control, value, surface]
      properties:
        control: { type: string }
        value: { description: "Option id, list of ids, boolean, or text" }
        answered_by: { type: string }
        answered_role: { type: string }
        surface: { $ref: '#/components/schemas/Surface' }
        device: { type: string, description: Device identifier or cryptographic proof for the responding device }
        path_taken: { type: array, items: { type: string } }
        duration_ms: { type: integer }
        voice_used: { type: boolean }
        passthrough: { type: object }
    AnswerRecord:
      type: object
      required: [request_id, control, surface]
      properties:
        request_id: { type: string }
        control: { type: string }
        value: { description: "Option id, list of ids, boolean, or text" }
        answered_by: { type: string }
        answered_role: { type: string }
        answered_at: { type: string, format: date-time }
        surface: { $ref: '#/components/schemas/Surface' }
        device: { type: string, description: Device identifier or cryptographic proof for the responding device }
        path_taken: { type: array, items: { type: string } }
        duration_ms: { type: integer }
        voice_used: { type: boolean }
        passthrough: { type: object }
    InboxStreamEvent:
      type: object
      required: [event, data, timestamp]
      properties:
        event:
          type: string
          enum: [request.created, request.escalated, request.answered, request.cancelled, request.expired]
        data:
          type: object
          description: >
            Event payload (such as CollectionRequest, AnswerRecord, or RequestReceipt).
            For request.created and request.escalated it also carries request_id and
            visible_to (array of device ids, HCA-P14).
        timestamp:
          type: string
          format: date-time
    ControlSpec:
      type: object
      properties:
        control: { type: string }
        request_schema: { type: object }
        answer_schema: { type: object }
        example: { type: object }
