      tags:
      - webhooks
      summary: Register Destination
      operationId: register_destination_v1_webhooks_post
      security:
      - AgentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRegisterRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecretResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - webhooks
      summary: List Destinations
      operationId: list_destinations_v1_webhooks_get
      security:
      - AgentKey: []
      parameters:
      - name: include_revoked
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Revoked
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDestinationView'
                title: Response List Destinations V1 Webhooks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/webhooks/{destination_id}/rotate:
    post:
      tags:
      - webhooks
      summary: Rotate Destination
      operationId: rotate_destination_v1_webhooks__destination_id__rotate_post
      security:
      - AgentKey: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
