              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
      description: Server-Sent Events for authorized inbox changes. Resume with Last-Event-ID or since; the header
        wins. Replay uses current device/tenant/owner authorization and stored routing. Invalid, expired, future
        or truncated replay and live queue overflow emit stream.reset; reconcile the complete paginated inbox and
        clear the old cursor. stream.closed reports revocation/supersession. Authorization is checked on a 15-second
        elapsed interval independent of traffic, with database/scheduler delay as documented. This stream is not
        a complete permanent audit log.
