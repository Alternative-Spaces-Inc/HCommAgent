openapi: 3.1.0
info:
  title: Human Collections Agent (HCA) API
  version: 0.3.0
  description: Requests are limited to 1 MiB before parsing or signature verification.
    Shared rate and tenant quotas return 429 with Retry-After. Collection reads use
    bounded limit/after parameters and optional X-HCA-Next-Cursor; continue even if
    visibility filtering leaves an empty page. Nested JSON policies are published
    as x-nested-json-policy because depth, total nodes and non-finite numbers are
    not fully expressible in JSON Schema. Control values are checked against the original
    ask's option IDs.
  x-max-request-body-bytes: 1048576
paths:
  /v1/requests:
    post:
      tags:
      - requests
      summary: Create Request
      operationId: create_request_v1_requests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReceipt'
          headers:
            Idempotent-Replayed:
              description: Present with true only when returning a stored idempotent
                response
              schema:
                type: string
                enum:
                - 'true'
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
        '413':
          description: Request body exceeds 1 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
        '429':
          description: Shared rate limit or tenant quota reached
          headers:
            Retry-After:
              description: Seconds until retry
              schema:
                type: string
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
        '400':
          description: Invalid operation or webhook destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
        '401':
          description: Missing, invalid, stale or replayed authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
        '403':
          description: Credential, owner membership, tenant or configured authorization
            refused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
        '409':
          description: Conflicting resource state or incomplete idempotent operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request
                content
              schema:
                type: string
                pattern: ^[0-9a-f]{32}$
      security:
      - AgentKey: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Optional caller/device-scoped key retained for the configured
          TTL (default 24 hours). Retries return the committed original status/body.
          Different input or resource with the same key returns 422.
  /v1/requests/{request_id}:
    get:
