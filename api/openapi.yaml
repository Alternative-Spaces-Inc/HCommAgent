openapi: 3.1.0
info:
  title: Human Collections Agent (HCA) API
  version: 0.3.0
  description: Collects tenant-authorized human decisions. Request bodies are limited to 1 MiB; nested JSON is limited
    to depth 12 and 10,000 visited values per field, with strings at most 4,000 characters and names at most 100
    unless a tighter schema bound applies. Shared fixed-minute actor/tenant/admin limits and active-request quotas
    return 429 with Retry-After. Lists default to 200 records, at most 500; follow X-HCA-Next-Cursor with after,
    including after a filtered empty page. Identity, authorized role and registered surface are server-derived.
    Path/audience/client telemetry are descriptive. See docs/SECURITY_REMEDIATION_01_12.md and docs/SECURITY_REMEDIATION_13_23.md
    for policy and validation boundaries.
paths:
  /v1/requests:
    post:
      tags:
      - requests
      summary: Create Request
      operationId: create_request_v1_requests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestReceipt'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
            Idempotent-Replayed:
              schema:
                type: string
              description: true for a stored idempotent response
        '413':
          description: Request body exceeds 1 MiB
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
        '429':
          description: Shared rate limit or tenant quota reached
          headers:
            Retry-After:
              description: Seconds until retry
              schema:
                type: string
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Request-ID:
              description: Server-generated correlation identifier; excludes request content
              schema:
                type: string
        '401':
          description: Missing bearer token
        '403':
          description: Invalid or revoked api key, or body.caller does not match the key's caller
      security:
      - AgentKey: []
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Persist one key per operation. The same key/body/resource returns its stored result; reuse
          for a different body/resource returns 422.
  /v1/requests/{request_id}:
    get:
      tags:
