<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Human Collections Agent: Options</title>
  <style>
    body { font: 13px system-ui, sans-serif; max-width: 420px; margin: 24px auto; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 10px; }
    button { padding: 6px 14px; }
    .saved { color: #2a7a2a; margin-left: 8px; }
    p.note { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Human Collections Agent</h1>
  <label for="api-base">API base URL</label>
  <input id="api-base" type="text" placeholder="https://hca-api-service-xxxxx.a.run.app" />
  <button id="save">Save</button>
  <span id="saved" class="saved" hidden>Saved</span>
  <p class="note">
    No Cloud Run URL is deployed yet; this is left blank until one exists.
    Once deployed, this origin should also be added to manifest.json's
    host_permissions so extension fetches are not subject to page CORS
    rules.
  </p>
  <script type="module" src="options.js"></script>
</body>
</html>
