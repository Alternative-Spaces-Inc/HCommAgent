<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Human Collections Agent</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 360px; margin: 0; padding: 10px; color: #111; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .empty { color: #666; padding: 12px 0; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .card.red-gate { border-color: #c0392b; background: #fdf0ee; }
    h2 { font-size: 15px; overflow-wrap: anywhere; }
    h3 { font-size: 13px; }
    fieldset { border: 0; padding: 0; margin: 12px 0; min-width: 0; }
    legend { font-weight: 600; padding: 0 0 6px; }
    select, textarea, input[type=search] { width: 100%; box-sizing: border-box; font: inherit; margin: 4px 0 8px; padding: 6px; }
    dt { font-weight: 600; }
    dd { margin: 0 0 8px; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    button:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 2px solid #174ea6; outline-offset: 2px; }
    .review-confirm { display: block; margin-bottom: 10px; }
    .title { font-weight: 600; margin-bottom: 4px; }
    .why { color: #555; margin-bottom: 8px; }
    .suggested { font-size: 12px; color: #2a7a2a; margin-bottom: 6px; }
    .options label { display: block; padding: 4px 0; }
    .options input { margin-right: 6px; }
    .actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; }
    button.primary { background: #2a6fdb; color: #fff; border-color: #2a6fdb; }
    button.deny { background: #c0392b; color: #fff; border-color: #c0392b; }
    .unsupported { color: #a05a00; font-size: 12px; }
    .error { color: #c0392b; font-size: 12px; margin-top: 6px; }
    .queue-notice { background: #fff6d6; color: #5a4300; padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Pending decisions</h1>
  <p id="api-origin"></p>
  <div id="queue-notice" class="queue-notice" role="status" aria-live="polite" hidden></div>
  <button id="dismiss-notice" type="button" hidden>Dismiss delivery notice</button>
  <p id="popup-error" class="error" role="alert"></p>
  <div id="cards"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
