<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Human Collections Agent</title>
  <style>
    /* HCA-P23 Day 1: mobile first card. Chrome caps a popup at 800 by 600, so the page is a
       flex column at 360 by at most 560; the list scrolls, each card is itself a flex column
       whose body scrolls while its header and action bar stay visible. No page scroll. */
    html, body { height: 100%; }
    body { font: 13px system-ui, sans-serif; width: 360px; max-height: 560px; margin: 0; padding: 10px; box-sizing: border-box; color: #111; display: flex; flex-direction: column; overflow: hidden; }
    h1 { font-size: 14px; margin: 0 0 8px; flex: none; }
    #api-origin, #queue-notice, #dismiss-notice, #popup-error { flex: none; }
    #api-origin { margin: 0 0 6px; color: #555; font-size: 12px; overflow-wrap: anywhere; }
    #cards { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .empty { color: #666; padding: 12px 0; }
    .card { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; max-height: 480px; background: #fff; }
    .card.red-gate { border-color: #c0392b; background: #fdf0ee; }
    .card-header { flex: none; padding: 10px 10px 6px; border-bottom: 1px solid #eee; }
    .card-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 10px; }
    .card-actions { flex: none; position: sticky; bottom: 0; padding: 8px 10px 10px; border-top: 1px solid #eee; background: inherit; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    h2 { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
    h3 { font-size: 13px; }
    fieldset { border: 0; padding: 0; margin: 12px 0; min-width: 0; }
    legend { font-weight: 600; padding: 0 0 6px; }
    select, textarea, input[type=search] { width: 100%; box-sizing: border-box; font: inherit; margin: 4px 0 8px; padding: 6px; }
    dt { font-weight: 600; }
    dd { margin: 0 0 8px; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    button:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 2px solid #174ea6; outline-offset: 2px; }
    .review-confirm { display: block; margin-bottom: 10px; }
    .title { font-weight: 600; margin-bottom: 4px; }
    .why { color: #555; margin: 6px 0 8px; }
    .suggested { font-size: 12px; color: #2a7a2a; margin-bottom: 6px; }
    .options label { display: block; padding: 4px 0; }
    .options input { margin-right: 6px; }
    .actions { display: contents; }
    button { font: inherit; padding: 8px 14px; min-height: 36px; border-radius: 6px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; }
    button.primary { background: #2a6fdb; color: #fff; border-color: #2a6fdb; }
    button.deny { background: #c0392b; color: #fff; border-color: #c0392b; }
    .unsupported { color: #a05a00; font-size: 12px; }
    .error { color: #c0392b; font-size: 12px; margin: 0; flex-basis: 100%; }
    .error:empty { display: none; }
    .queue-notice { background: #fff6d6; color: #5a4300; padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Pending decisions</h1>
  <p id="api-origin"></p>
  <div id="queue-notice" class="queue-notice" role="status" aria-live="polite" hidden></div>
  <button id="dismiss-notice" type="button" hidden>Dismiss delivery notice</button>
  <p id="popup-error" class="error" role="alert"></p>
  <div id="cards"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
