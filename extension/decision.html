<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decision: Human Collections Agent</title>
  <style>
    /* HCA-P23 Day 1: the notification fallback page. One ask, rendered at phone width in a
       full tab when Chrome refuses to open the popup. Header and action bar stay in view at
       375 by 667; the body scrolls inside the card. */
    html, body { height: 100%; }
    body { font: 15px system-ui, sans-serif; margin: 0; padding: 12px; box-sizing: border-box; color: #111; background: #f3f4f6; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    main { width: 100%; max-width: 420px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #555; flex: none; }
    #api-origin, #queue-notice, #dismiss-notice, #popup-error { flex: none; }
    #api-origin { margin: 0 0 6px; color: #555; font-size: 12px; overflow-wrap: anywhere; }
    #cards { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .empty { color: #666; padding: 12px 0; }
    .card { border: 1px solid #ddd; border-radius: 10px; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; background: #fff; }
    .card.red-gate { border-color: #c0392b; background: #fdf0ee; }
    .card-header { flex: none; padding: 14px 14px 8px; border-bottom: 1px solid #eee; }
    .card-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 14px; }
    .card-actions { flex: none; position: sticky; bottom: 0; padding: 10px 14px 14px; border-top: 1px solid #eee; background: inherit; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    h2 { font-size: 18px; margin: 0; overflow-wrap: anywhere; }
    h3 { font-size: 14px; }
    fieldset { border: 0; padding: 0; margin: 12px 0; min-width: 0; }
    legend { font-weight: 600; padding: 0 0 6px; }
    select, textarea, input[type=search] { width: 100%; box-sizing: border-box; font: inherit; margin: 4px 0 8px; padding: 8px; }
    dt { font-weight: 600; }
    dd { margin: 0 0 8px; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    button:disabled { cursor: wait; opacity: .65; }
    :focus-visible { outline: 2px solid #174ea6; outline-offset: 2px; }
    .review-confirm { display: block; margin-bottom: 10px; }
    .title { font-weight: 600; margin-bottom: 4px; }
    .why { color: #555; margin: 6px 0 8px; }
    .suggested { font-size: 13px; color: #2a7a2a; margin-bottom: 6px; }
    .options label { display: block; padding: 6px 0; }
    .options input { margin-right: 8px; }
    .actions { display: contents; }
    button { font: inherit; padding: 10px 16px; min-height: 44px; border-radius: 8px; border: 1px solid #bbb; background: #f5f5f5; cursor: pointer; flex: 1 1 auto; }
    button.primary { background: #2a6fdb; color: #fff; border-color: #2a6fdb; }
    button.deny { background: #c0392b; color: #fff; border-color: #c0392b; }
    .unsupported { color: #a05a00; font-size: 12px; }
    .error { color: #c0392b; font-size: 13px; margin: 0; flex-basis: 100%; }
    .error:empty { display: none; }
    .queue-notice { background: #fff6d6; color: #5a4300; padding: 6px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body data-page="decision">
  <main>
    <h1>Human Collections Agent</h1>
    <p id="api-origin"></p>
    <div id="queue-notice" class="queue-notice" role="status" aria-live="polite" hidden></div>
    <button id="dismiss-notice" type="button" hidden>Dismiss delivery notice</button>
    <p id="popup-error" class="error" role="alert"></p>
    <div id="cards"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
